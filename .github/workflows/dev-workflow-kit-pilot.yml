name: Developer Workflow Kit Pilot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    uses: wosafety0/dev-workflow-kit/.github/workflows/reusable-acceptance.yml@65544e290fd875bb6c4e30f6525b238200037bba
    with:
      runtime: "node"
      node-version: "26"
      test-command: "npm install --global pnpm@11.4.0 && pnpm install --frozen-lockfile && pnpm check"
